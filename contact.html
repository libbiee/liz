			h2 {

.team-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); /* Responsive grid */
            gap: 20px;
            justify-items: center;
            margin-top: 20px;
        }

        .team-member {
            text-align: center;
        }

        .team-member img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            transition: transform 0.3s;
        }

        .team-member img:hover {
            transform: scale(1.1);
        }

        .team-member p {
            margin-top: 10px;
            font-weight: bold;
        }

        footer {
            background-color: #bae1ff;
            padding: 20px;
            text-align: center;
            color: white;
            margin-top: 40px;
        }

        /* Media Query for Smaller Screens (Mobile) */
        @media (max-width: 600px) {
            .team-grid {
                grid-template-columns: repeat(2, 1fr); /* Switch to 2 columns on mobile */
            }

            .team-member img {
                width: 120px; /* Slightly smaller images on mobile */
                height: 120px;
            }
        }

        /* Media Query for Very Small Screens */
        @media (max-width: 400px) {
            .team-grid {
                grid-template-columns: 1fr; /* Single column on very small screens */
            }

            .team-member img {
                width: 100px; /* Even smaller images for tiny screens */
                height: 100px;
            }
        }

/* Styling the hyperlinks */
        a {
            color: #FFB6C1; /* Pastel pink color */
            text-decoration: none; /* Remove underline */
        }

        a:hover {
            text-decoration: underline; /* Add underline on hover */
            color: #FF91A4; /* Slightly darker pastel pink on hover */
        }

    </style>
